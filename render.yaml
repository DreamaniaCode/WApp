services:
  - type: web
    name: wapp-backend
    env: docker
    plan: free # Change to 'starter' if you need more RAM for Puppeteer
    region: frankfurt # Or your preferred region
    envVars:
      - key: PORT
        value: 3001
      - key: FRONTEND_URL
        value: https://w-app-sigma.vercel.app
      - key: NEXT_PUBLIC_API_URL
        value: https://wapp-backend.onrender.com # Change this if Render gives you a different URL
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
