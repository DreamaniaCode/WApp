<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WApp Manager</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #1a1a1a;
        color: #ffffff;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        flex-direction: column;
        user-select: none;
        -webkit-app-region: drag; /* Allow dragging the window */
      }
      .container {
        text-align: center;
      }
      h1 {
        font-size: 24px;
        margin-bottom: 10px;
        font-weight: 600;
      }
      p {
        font-size: 14px;
        color: #aaaaaa;
        margin-bottom: 20px;
      }
      a {
        color: #4ade80;
        text-decoration: none;
        font-weight: 500;
        cursor: pointer;
        -webkit-app-region: no-drag; /* Links must be clickable */
      }
      a:hover {
        text-decoration: underline;
      }
      .loader {
        border: 4px solid #333;
        border-top: 4px solid #4ade80;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        animation: spin 1s linear infinite;
        margin: 20px auto;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>WApp Manager</h1>
      <p>by DreamaniaCode</p>
      <div class="loader"></div>
      <p>Starting up...</p>
      <p>
        <a href="#" id="link">https://dreamaniacode.vercel.app</a>
      </p>
    </div>
    <script>
      const { shell } = require("electron");
      document.getElementById("link").addEventListener("click", (e) => {
        e.preventDefault();
        shell.openExternal("https://dreamaniacode.vercel.app");
      });
    </script>
  </body>
</html>
